# OpenSpec 项目配置。
#
# `schema` 是 openspec CLI 的唯一官方字段；`orchestration` 是自定义扩展
# （GlobalConfigSchema passthrough 保留未知字段），供 dag-orchestrator /
# subagents 编排 apply 阶段任务时读取——它定义本仓库 openspec change 的
# 任务编排原则，任务清单 (tasks.md) 按此原则写成 DAG 节点。

schema: spec-driven

# ── 编排扩展（dag-orchestrator / subagents）────────────────────────────
#
# 原则：任何 change 的 tasks.md 都按 DAG 编排 —— 节点声明 depends 依赖，
# 引擎自动并行触发前置满足的节点；单任务/线性清单用 todo_write。
#
# 节点 ID 编码（dag-orchestrator 规范）:
#   `<阶段数字>-<kebab-case 语义名>`，如 `3-move-modules`、`4-local-executor`
#   并行分支加语义后缀（`4-local-executor` / `5-commands-layer` 同阶段不同步）。
#
# 依赖规则:
#   - 每个非根节点必须声明 `[depends: <id>, ...]`；缺失 = 全并行（禁止）。
#   - 只有文件不相交的节点才并行；共享文件（lib.rs / Cargo.toml / 同一
#     module 树）的节点必须串行或合并为一个节点 —— 并行节点共享主工作树时
#     改动混叠，按任务声明的文件清单做归属判定。
#
# agent 映射（.pi/subagents/config.yaml 中的 agent 名）:
#   executor: 代码实现（executor-coder）    verify: 验证/检查（checker）
#   writer: 文档（executor-writer）
#
# 提交纪律:
#   - 每节点完成即小步 commit（Conventional Commits，引用 issue 编号），
#     不等 DAG 全部结束；push 前 git fetch + rebase origin/main。
#   - 并行节点在独立 worktree 工作，完成后合并回 main（scripts/wt.sh）。
#
# 验收:
#   - 每个节点任务文本必须含验收检查（构建/测试/断言），节点报告≠最终
#     事实 —— 终态验收由 verify 节点基于最新 HEAD 复核。

orchestration:
  engine: dag-orchestrator
  max_concurrency: 4
  fail_fast: false          # 节点失败只 cancel 其下游闭包，独立分支继续
  agents:
    executor: executor-coder
    verify: checker
    writer: executor-writer
  principles:
    node_ids: "<阶段数字>-<kebab-case 语义名>"
    dependsOn: "每个非根节点必须声明 [depends: ...]，缺失 = 全并行（禁止）"
    parallel: "仅文件不相交的节点并行；共享文件（lib.rs/Cargo.toml/module 树）串行或合并"
    worktree: "并行节点独立 worktree，完成即合并回 main"
    commit: "节点完成即小步 commit（Conventional Commits + issue 引用），不等 DAG 结束"
    acceptance: "节点任务文本必须含验收检查；verify 节点基于最新 HEAD 复核"
