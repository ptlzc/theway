[workspace]
resolver = "2"
members = [
    "crates/theway-llm-provider",
    "crates/mermaid-parser",
    "crates/theway-contract",
    "crates/theway-core",
    "crates/theway-storage",
    "crates/theway-daemon",
    "crates/theway-tui",
    "crates/theway-mcp",
    "crates/theway-transport",
    "crates/theway-probe",
    "crates/tests-bridge-macro",
    "crates/theway-markdown",
    "crates/theway-markdown-core",
    "crates/theway-ratatui-textarea",
    "crates/theway-pager-render",
]

# Version policy: the runtime crates (theway-core, theway-daemon, theway-tui,
# theway-transport, theway-storage, theway-contract, theway-mcp,
# theway-llm-provider, theway-probe, tests-bridge-macro) release together and
# inherit this version. Vendored/port crates keep independent versions and
# licenses: `mermaid-rs-parser` (vendored upstream, MIT) and the Grok Build
# ports (`theway-markdown`, `theway-markdown-core`, `theway-pager-render`,
# `theway-ratatui-textarea`, Apache-2.0).
[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["theway contributors"]
repository = "https://github.com/ptlzc/theway"
homepage = "https://github.com/ptlzc/theway"

# Lint policy applied to every workspace member that opts in via `lints.workspace = true`.
# Pedantic clippy lints that flag style rather than bugs are downgraded to "allow"; everything
# else still trips `-D warnings` in CI.
[workspace.lints.clippy]
large_enum_variant = "allow"
module_inception = "allow"
type_complexity = "allow"
manual_div_ceil = "allow"
too_many_arguments = "allow"
new_without_default = "allow"
# Tests / setup code holds short-lived std::Mutex guards across `.await`; we keep them on
# purpose (the lock scope never crosses tokio runtime boundaries that would deadlock).
await_holding_lock = "allow"
# The struct-then-assign pattern is more readable than nested `Default::default()` overrides
# when many fields are set conditionally.
field_reassign_with_default = "allow"
# `match` arm guards with `matches!` read clearer than nested patterns in our context.
redundant_guards = "allow"

[profile.dev]
opt-level = 0

[profile.release]
lto = "thin"
codegen-units = 1
# Strip debug symbols from release binaries (~7 MB smaller for thewayd).
strip = "symbols"

[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
