// Sidebar skills domain: skill discovery counts and per-skill summary.

syntax = "proto3";
package theway.grpc.v1;

message SkillsSnapshot {
  uint32 total = 1;
  uint32 enabled = 2;
  uint32 disabled = 3;
  uint32 builtin = 4;
  uint32 user = 5;
  uint32 project = 6;
  repeated SkillSnapshot items = 7;
}

message SkillSnapshot {
  string name = 1;
  string source = 2;
  string file_path = 3;
  bool enabled = 4;
}
