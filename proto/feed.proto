// Feed domain: renderable session feed blocks. `FeedBlock.oneof` mirrors the
// serde-tagged `WireFeedBlock` enum carried by the JSON channels.

syntax = "proto3";
package theway.grpc.v1;

// One renderable feed entry. oneof mirrors the serde tagged enum WireFeedBlock;
// JSON channels keep serde shape until the protojson migration.
message FeedBlock {
  oneof kind {
    UserBlock user = 1;
    AssistantBlock assistant = 2;
    ThinkingBlock thinking = 3;
    ToolBlock tool = 4;
    ToolResultBlock tool_result = 5;
    PlainBlock plain = 6;
  }
}

message UserBlock {
  string text = 1;
  optional string timestamp = 2;
}

message AssistantBlock {
  string text = 1;
  optional string timestamp = 2;
}

message ThinkingBlock {
  string text = 1;
  optional string timestamp = 2;
}

message ToolBlock {
  string name = 1;
  string args = 2;
  optional string timestamp = 3;
}

message ToolResultBlock {
  repeated string lines = 1;
  bool is_error = 2;
  optional string timestamp = 3;
}

message PlainBlock {
  string text = 1;
  string level = 2; // "output" | "system" | "error" | "note" (serde snake_case variant names)
  optional string timestamp = 3;
}
