// Session status domain: model catalog plus the current-session status
// snapshots mounted on `SessionState` (trigger poll, goal, control-plane prompt).

syntax = "proto3";
package theway.grpc.v1;

message ProviderGroup {
  string provider = 1;
  bool has_credential = 2;
  repeated ModelEntry models = 3;
}

message ModelEntry {
  string id = 1;
  string name = 2;
}

message TriggerPollStatus {
  string checked_at = 1;
  string trace_id = 2;
  string source_label = 3;
  string event_label = 4;
  string summary = 5;
}

message GoalSnapshot {
  string condition = 1;
  string status = 2;
  uint32 iterations = 3;
  optional string last_reason = 4;
}

message ControlPlanePromptSnapshot {
  string tool_name = 1;
  string label = 2;
  string reason = 3;
  string args_hash = 4;
  string payload = 5;
}
