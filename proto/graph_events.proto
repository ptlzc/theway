// Graph event domain: DAG engine node and run status increments.

syntax = "proto3";
package theway.grpc.v1;

message NodeStatus {
  string run_id = 1;
  string node_id = 2;
  string status = 3;
  optional string error = 4;
}

message RunStatus {
  string run_id = 1;
  string status = 2;
  optional string error = 3;
}
