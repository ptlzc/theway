// Sidebar triggers domain: trigger rule counts and per-rule summary.

syntax = "proto3";
package theway.grpc.v1;

message TriggersSnapshot {
  uint32 total = 1;
  uint32 enabled = 2;
  uint32 disabled = 3;
  repeated TriggerRuleSnapshot rules = 4;
}

message TriggerRuleSnapshot {
  string id = 1;
  string full_id = 2;
  bool enabled = 3;
  string mode = 4;
  string condition = 5;
  string action = 6;
}
