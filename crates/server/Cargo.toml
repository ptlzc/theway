[package]
name = "theway"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway: agent server (fork of theway) — REPL TUI, graph engineering mode, goal loops, cron/triggers, gRPC/HTTP/WS transport servers (server-first; the `theway` binary is the server entry, `tui` optional for terminal UI)."
license = "MIT"
authors = ["theway contributors"]

[features]
# Server-first: transport servers (gRPC/HTTP/WS) are always on — theway IS an
# agent server. `tui` stays optional (terminal UI); embeds that only want the
# headless server set default-features = false.
default = ["tui"]
# Terminal UI (ratatui TUI + terminal input). Optional: headless server embeds
# (or CI) can use default-features = false.
tui = ["dep:crossterm", "dep:ratatui", "dep:tui-textarea", "dep:arboard", "dep:qrcode", "dep:image"]

[lib]
name = "theway"
path = "src/lib.rs"

# The `theway` CLI binary (consolidated back from the former `theway-cli` crate, openspec
# consolidate-server-cli 2.x). Thin assembly layer over this crate's lib: TUI dispatch plus
# `--web` / `--grpc` hand-off into `transport::{http,grpc}`. Both features are compile-time
# constants for this target, so `main.rs` needs no cfg gating.
[[bin]]
name = "theway"
path = "src/main.rs"

[dependencies]
# Enable every wire-protocol provider so model auto-detection isn't bottlenecked by feature
# flags. The cost is compile time, not runtime — only the registered provider for the chosen
# model's `api` actually gets exercised.
theway-llm-provider = { path = "../llm-provider", default-features = false, features = ["all-providers"] }
theway-core = { path = "../core" }
theway-mcp = { path = "../mcp" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
# CLI argument parsing for the `theway` [[bin]] (src/main.rs).
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"

# Local-execution tools (`src/tools/`): outline.rs drives tree-sitter structural
# outlines. Versions stay in lockstep with the engine's former copy.
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"

# Transport server stack (feature `server`, consolidated from theway-server).
# HTTP/WS server: axum router + SSE + WebSocket upgrade.
axum = { version = "0.8", features = ["ws"] }
# gRPC wire stack: tonic "server" is the runtime mode; "channel" backs the
# generated client; "codegen" supports tonic::include_proto!; tonic-prost
# supplies the ProstCodec the generated code references.
prost = "0.14"
tonic = { version = "0.14", features = ["server", "channel", "codegen"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net", "sync"] }

toml = "0.8"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
once_cell = "1"
regex = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
ratatui = { version = "0.29", optional = true }
tui-textarea = { version = "0.7", optional = true }
unicode-width = "0.2"
arboard = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
directories = "5"

[target.'cfg(unix)'.dependencies]
# Unix-only: process-group teardown (`setsid` + `killpg`) for `bash` tool and shell
# hooks. Direct SIGKILL on the shell PID leaks descendants like `(sleep 60) & wait`;
# running the child in its own process group lets us KILL the whole tree on
# timeout/cancel. Same pattern as `NativeEnv::exec` (PR #40), the bash tool (PR #41),
# and shell hooks (PR #58).
libc = "0.2"

[build-dependencies]
# Pure-Rust proto compiler (no system protoc required) + tonic codegen bridge
# for the `server` feature's proto wire codecs (build.rs).
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

# cargo-machete false positive: prost/tonic-prost are referenced by the proto
# generated code (tonic::include_proto! in transport/proto.rs) which lives in
# OUT_DIR and is invisible to machete's source scan.
[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]
