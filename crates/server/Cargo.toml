[package]
name = "theway-server"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway-server: transport server crate — gRPC/HTTP/WS servers + proto wire codecs; programs against the public theway::ui::web_loop channel surface."
license = "MIT"
authors = ["theway contributors"]

[dependencies]
# SDK headless (default-features = false): no terminal stack needed by the servers.
theway = { path = "../app", default-features = false }
theway-core = { path = "../core" }
theway-llm-provider = { path = "../llm-provider", default-features = false, features = ["all-providers"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"

# HTTP/WS server stack (`--web` mode): axum router + SSE + WebSocket upgrade.
axum = { version = "0.8", features = ["ws"] }

# gRPC wire stack (same versions/features as crates/app): tonic "server" is the
# runtime mode; "channel" backs the generated client; "codegen" supports
# tonic::include_proto!; tonic-prost supplies the ProstCodec the generated code
# references.
prost = "0.14"
tonic = { version = "0.14", features = ["server", "channel", "codegen"] }
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"

[dev-dependencies]
# Router e2e tests (`http/tests/endpoints.rs`) drive the running server over
# real HTTP/WS. `json` comes through feature unification with
# theway-llm-provider's reqwest.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }

[build-dependencies]
# Pure-Rust proto compiler (no system protoc required) + tonic codegen bridge.
protox = "0.9"
tonic-prost-build = "0.14"

[lints]
workspace = true
