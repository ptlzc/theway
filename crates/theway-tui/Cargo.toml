[package]
name = "theway-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "theway CLI binary — ratatui client of thewayd plus offline session commands; depends on transport/storage contracts, never on the daemon runtime core."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "theway"
path = "src/main.rs"

[dependencies]
theway-contract = { version = "0.1.4", path = "../theway-contract" }
theway-storage = { version = "0.1.4", path = "../theway-storage" }
theway-transport = { version = "0.1.4", path = "../theway-transport" }
theway-markdown = { version = "0.1.0", path = "../theway-markdown" }

# Terminal UI surface (moved out of the daemon crate; the ratatui full-screen REPL,
# web/grpc transport event loop, feed, listener and relay all live in this crate).
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29", features = ["unstable-widget-ref"] }
theway-ratatui-textarea = { version = "0.1.0", path = "../theway-ratatui-textarea" }
theway-pager-render = { version = "0.1.0", path = "../theway-pager-render" }
unicode-width = "0.2"
anstyle = "1"
arboard = { version = "3" }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
regex = "1"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rpassword = "7"
tracing = "0.1"
once_cell = "1"

[dev-dependencies]
tests-bridge-macro = { version = "0.1.4", path = "../tests-bridge-macro" }
tempfile = "3"
parking_lot = "0.12"

[lints]
workspace = true
