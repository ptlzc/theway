[package]
name = "theway-tui"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway CLI binary — REPL/TUI + session commands on top of the theway SDK library (theway-server)."
license = "MIT"
repository = "https://github.com/ptlzc/theway"
authors = ["theway contributors"]

[[bin]]
name = "theway"
path = "src/main.rs"

[dependencies]
theway = { path = "../theway-server", features = ["tui"] }
theway-core = { path = "../theway-core" }
theway-llm-provider = { path = "../theway-llm-provider" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
parking_lot = "0.12"
once_cell = "1"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
tempfile = "3"
theway-mcp = { path = "../theway-mcp" }

[lints]
workspace = true
