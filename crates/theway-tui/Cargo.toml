[package]
name = "theway-tui"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway CLI binary — REPL/TUI + session commands on top of the theway SDK library (crates/theway-sdk)."
license = "MIT"
repository = "https://github.com/ptlzc/theway"
authors = ["theway contributors"]

[[bin]]
name = "theway"
path = "src/main.rs"

[dependencies]
theway-core = { path = "../theway-core" }
theway-storage = { path = "../theway-storage" }
theway-transport = { path = "../theway-transport" }
theway-llm-provider = { path = "../theway-llm-provider" }

# Terminal UI surface (moved out of the daemon crate; the ratatui full-screen REPL,
# web/grpc transport event loop, feed, listener and relay all live in this crate).
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = { version = "0.29" }
tui-textarea = { version = "0.7" }
unicode-width = "0.2"
arboard = { version = "3" }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
regex = "1"

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rpassword = "7"
tracing = "0.1"
once_cell = "1"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
tempfile = "3"
parking_lot = "0.12"

[lints]
workspace = true
