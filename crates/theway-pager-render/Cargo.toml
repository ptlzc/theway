[package]
name = "theway-pager-render"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "theway port of Grok Build render primitives: color, line utils, scrollbar, OSC8 link detection, tool paths"
repository = "https://github.com/ptlzc/theway"

[dependencies]
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = "0.1"
tui-scrollbar = "0.2"
linkify = "0.10"
url = "2"
unicode-width = "0.2"
unicode-segmentation = "1"
regex = "1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
