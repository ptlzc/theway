[package]
name = "theway"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway: local agent runtime SDK (fork of theway) — REPL TUI, graph engineering mode, goal loops, cron/triggers. The CLI binary lives in theway-cli; transport servers in theway-server."
license = "MIT"
authors = ["theway contributors"]

[features]
# SDK default is headless: no terminal stack. The theway-cli binary enables it via
# feature forwarding (`tui = ["theway/tui"]`); external projects opt in with features = ["tui"].
default = []
# Terminal UI (ratatui TUI + terminal input). External projects that only embed the
# runtime headless (transport servers / AgentSession) can set default-features = false.
tui = ["dep:crossterm", "dep:ratatui", "dep:tui-textarea", "dep:arboard", "dep:qrcode", "dep:image"]
# Transport servers (`--web` axum HTTP/SSE + WebSocket, `--grpc` tonic) plus the
# proto wire codecs, consolidated from the former `theway-server` crate.
server = ["dep:axum", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tokio-stream"]

[lib]
name = "theway"
path = "src/lib.rs"

[dependencies]
# Enable every wire-protocol provider so model auto-detection isn't bottlenecked by feature
# flags. The cost is compile time, not runtime — only the registered provider for the chosen
# model's `api` actually gets exercised.
theway-llm-provider = { path = "../llm-provider", default-features = false, features = ["all-providers"] }
theway-core = { path = "../core" }
theway-mcp = { path = "../mcp" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"

# Transport server stack (feature `server`, consolidated from theway-server).
# HTTP/WS server: axum router + SSE + WebSocket upgrade.
axum = { version = "0.8", features = ["ws"], optional = true }
# gRPC wire stack: tonic "server" is the runtime mode; "channel" backs the
# generated client; "codegen" supports tonic::include_proto!; tonic-prost
# supplies the ProstCodec the generated code references.
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", features = ["server", "channel", "codegen"], optional = true }
tonic-prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", features = ["net", "sync"], optional = true }

toml = "0.8"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
once_cell = "1"
regex = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
crossterm = { version = "0.28", features = ["event-stream"], optional = true }
ratatui = { version = "0.29", optional = true }
tui-textarea = { version = "0.7", optional = true }
unicode-width = "0.2"
arboard = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
qrcode = { version = "0.14", default-features = false, optional = true }
ignore = "0.4"
# tree-sitter structural outline (tools/outline.rs) — same version family as the
# enhanced-tools native addon; grammar crates must stay compatible with the core pin.
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
sha2 = "0.10"
hex = "0.4"
serde_yaml = "0.9"
directories = "5"

[target.'cfg(unix)'.dependencies]
# Unix-only: process-group teardown (`setsid` + `killpg`) for `bash` tool and shell
# hooks. Direct SIGKILL on the shell PID leaks descendants like `(sleep 60) & wait`;
# running the child in its own process group lets us KILL the whole tree on
# timeout/cancel. Same pattern as `NativeEnv::exec` (PR #40), the bash tool (PR #41),
# and shell hooks (PR #58).
libc = "0.2"

[build-dependencies]
# Pure-Rust proto compiler (no system protoc required) + tonic codegen bridge
# for the `server` feature's proto wire codecs (build.rs).
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
