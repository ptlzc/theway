[package]
name = "theway-ratatui-textarea"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "theway port of the Grok Build textarea: an advanced TextArea widget for ratatui with undo/redo, soft-wrap, mouse selection, scrollbar and atomic text elements"
authors = ["theway contributors"]
repository = "https://github.com/ptlzc/theway"

[dependencies]
crossterm = { version = "0.28", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.29", features = ["crossterm", "unstable-widget-ref"] }
ratatui-core = "0.1"
textwrap = "0.16"
tui-scrollbar = "0.2"
unicode-segmentation = "1.12"
unicode-width = "0.2"

[dev-dependencies]
# Used by unit tests (fuzzing / seeded assertions):
#   rand, chrono, itertools, pretty_assertions
# Used by examples/textarea_demo.rs (kept so the example compiles):
#   arboard, fuzzy-matcher, ignore
arboard = "3"
chrono = "0.4"
fuzzy-matcher = "0.3"
ignore = "0.4"
itertools = "0.14"
pretty_assertions = "1"
rand = "0.9"
tests-bridge-macro = { version = "0.1.4", path = "../tests-bridge-macro" }

[[example]]
name = "textarea_demo"
path = "examples/textarea_demo.rs"

# Clippy policy: this crate is excluded from the root workspace, so the table is carried
# explicitly instead of inheriting `[workspace.lints.clippy]`. Keep the two in sync.
[lints.clippy]
large_enum_variant = "allow"
module_inception = "allow"
type_complexity = "allow"
manual_div_ceil = "allow"
too_many_arguments = "allow"
new_without_default = "allow"
# Tests / setup code holds short-lived std::Mutex guards across `.await`; we keep them on
# purpose (the lock scope never crosses tokio runtime boundaries that would deadlock).
await_holding_lock = "allow"
# The struct-then-assign pattern is more readable than nested `Default::default()` overrides
# when many fields are set conditionally.
field_reassign_with_default = "allow"
# `match` arm guards with `matches!` read clearer than nested patterns in our context.
redundant_guards = "allow"

# Own workspace root: the repository root manifest excludes this crate, so its
# dependency resolution, lockfile, and lint configuration are standalone.
[workspace]
resolver = "2"
