[package]
name = "theway-llm-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust rewrite of the original pi AI client — unified streaming LLM client across Anthropic / OpenAI / Google / Bedrock / Mistral and OpenAI-compatible endpoints."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "theway_llm_provider"
path = "src/lib.rs"

[features]
default = ["anthropic", "faux"]

# Each provider is opt-in via feature so a thin consumer can avoid pulling SDK glue it doesn't need.
anthropic = []
openai-completions = []
openai-responses = []
openai-codex-responses = []
azure-openai-responses = []
google = []
google-vertex = []
amazon-bedrock = ["dep:async-stream", "dep:hex", "dep:hmac", "dep:sha2"]
cloudflare = []
mistral = []
faux = ["dep:uuid"]

# Image-generation providers are gated separately.
openrouter-images = []

# Bundle everything (used by the workspace's smoke tests).
all-providers = [
    "anthropic",
    "openai-completions",
    "openai-responses",
    "openai-codex-responses",
    "azure-openai-responses",
    "google",
    "google-vertex",
    "amazon-bedrock",
    "cloudflare",
    "mistral",
    "faux",
    "openrouter-images",
]

[dependencies]
# Async runtime + HTTP/SSE.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
futures-core = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
async-trait = "0.1"
bytes = "1"

# Serialization. Tool-call args + provider payloads are JSON-shaped.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Enum ↔ string mapping derives (KnownApi::as_str).
strum = { version = "0.28", features = ["derive"] }

# Misc utilities.
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
once_cell = "1"
rand = "0.9"
base64 = "0.22"
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
async-stream = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
tracing = "0.1"
regex = "1"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tempfile = "3"

[[example]]
name = "anthropic_hello"
required-features = ["anthropic"]

[[example]]
name = "gpt55_hello"
required-features = ["openai-responses"]

[lints]
workspace = true
