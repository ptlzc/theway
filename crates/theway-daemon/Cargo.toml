[package]
name = "theway-daemon"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway daemon — headless agent runtime server (bin `thewayd`): harness assembly, local tools, triggers/cron, skills, MCP/LSP wiring, DAG engine persistence, gRPC/HTTP/MCP transports. Consumes the `theway` SDK for the client-facing surface (session/config/auth/commands); terminal UI lives in the theway-tui crate."
license = "MIT"
authors = ["theway contributors"]

[lib]
name = "theway_daemon"
path = "src/lib.rs"

[features]
# Kernel execution backends (daemon-kernel-layers): the daemon is the single
# kernel; `local` drives tools straight against the local FS + process table
# (LocalExecutor + NativeEnv), `sandbox` injects a sandbox executor stub. Both
# features share the same tool bodies and assembly.
default = ["local"]
local = []
sandbox = []

[dependencies]
# Enable every wire-protocol provider so model auto-detection isn't bottlenecked by feature
# flags. The cost is compile time, not runtime — only the registered provider for the chosen
# model's `api` actually gets exercised.
theway-llm-provider = { path = "../theway-llm-provider", default-features = false, features = ["all-providers"] }
theway-contract = { path = "../theway-contract" }
theway-core = { path = "../theway-core" }
theway-storage = { path = "../theway-storage" }
theway-mcp = { path = "../theway-mcp" }
theway-transport = { path = "../theway-transport" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"

# Shared app kernel (feed model renders ratatui lines; the daemon and the TUI
# both depend on this crate).
qrcode = { version = "0.14", default-features = false }

# Local-execution tools (`src/tools/`): outline.rs drives tree-sitter structural
# outlines. Versions stay in lockstep with the engine's former copy.
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"

# Transport server stack (feature `server`, consolidated transport stack).

toml = "0.8"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
once_cell = "1"
regex = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strum = { version = "0.28", features = ["derive"] }
# TS extension host (`ts_extensions`): oxc TS→JS transpilation + embedded QuickJS
# (rquickjs). The core runtime no longer owns extension loading — the CLI (host) does.
rquickjs = { version = "0.11.0", features = ["full"] }
oxc_allocator = "0.75.1"
oxc_codegen = "0.75.1"
oxc_parser = "0.75.1"
oxc_semantic = "0.75.1"
oxc_span = "0.75.1"
oxc_transformer = "0.75.1"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
directories = "5"

[target.'cfg(unix)'.dependencies]
# Unix-only: process-group teardown (`setsid` + `killpg`) for `bash` tool and shell
# hooks. Direct SIGKILL on the shell PID leaks descendants like `(sleep 60) & wait`;
# running the child in its own process group lets us KILL the whole tree on
# timeout/cancel. Same pattern as `NativeEnv::exec` (PR #40), the bash tool (PR #41),
# and shell hooks (PR #58).
libc = "0.2"

# Cross-process file lock for the edit tool's read→modify→write cycle (issue #17).
# Already in the dependency tree via tantivy, so this adds no new packages.
fs4 = "0.13"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
tempfile = "3"

[lints]
workspace = true

