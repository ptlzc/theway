[package]
name = "theway-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "theway daemon — the single agent-runtime kernel (bin `thewayd`): harness assembly, local/sandbox tool policy, triggers/cron/session/DAG runtime, skills, MCP/LSP wiring, serving the gRPC/HTTP/MCP transports from theway-transport. Terminal UI lives in the theway-tui crate."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "theway_daemon"
path = "src/lib.rs"

[features]
# Controller-side execution modes (issue #78): the daemon no longer executes
# file/process operations locally — they are forwarded to the controller's
# ToolService endpoint. `local` / `sandbox` are retained as compatibility
# feature names for the controller-side executor selection; the daemon build
# itself is execution-agnostic.
default = ["local"]
local = []
sandbox = []

[dependencies]
# Enable every wire-protocol provider so model auto-detection isn't bottlenecked by feature
# flags. The cost is compile time, not runtime — only the registered provider for the chosen
# model's `api` actually gets exercised.
theway-llm-provider = { version = "0.1.5", path = "../theway-llm-provider", default-features = false, features = ["all-providers"] }
theway-contract = { version = "0.1.5", path = "../theway-contract" }
theway-core = { version = "0.1.5", path = "../theway-core" }
theway-storage = { version = "0.1.5", path = "../theway-storage" }
theway-mcp = { version = "0.1.5", path = "../theway-mcp" }
theway-transport = { version = "0.1.5", path = "../theway-transport" }
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "net", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
opentelemetry = { version = "0.31", features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "metrics", "reqwest-rustls", "trace"] }
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
base64 = "0.22"

# Local-execution tools (`src/tools/`): outline.rs drives tree-sitter structural
# outlines. Versions stay in lockstep with the engine's former copy.
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"

# Config readers + session-scoped sidecar formats (trigger/cron/skill files).
toml = "0.8"
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
once_cell = "1"
regex = "1"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
strum = { version = "0.28", features = ["derive"] }
# TS extension host (`ts_extensions`): oxc TS→JS transpilation + embedded QuickJS
# (rquickjs). The core runtime no longer owns extension loading — the CLI (host) does.
rquickjs = { version = "0.11.0", default-features = false, features = ["loader"] }
oxc_allocator = "0.75.1"
oxc_codegen = "0.75.1"
oxc_parser = "0.75.1"
oxc_semantic = "0.75.1"
oxc_span = "0.75.1"
oxc_transformer = "0.75.1"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
ignore = "0.4"
sha2 = "0.10"
hex = "0.4"
directories = "5"

# Cross-process file lock for the edit tool's read→modify→write cycle (issue #17).
# Already in the dependency tree via tantivy, so this adds no new packages. fs4 maps
# to LockFileEx on Windows, so the lock semantics hold on every release target.
fs4 = "0.13"

[target.'cfg(unix)'.dependencies]
# Unix-only: process-group teardown (`setsid` + `killpg`) for `bash` tool and shell
# hooks. Direct SIGKILL on the shell PID leaks descendants like `(sleep 60) & wait`;
# running the child in its own process group lets us KILL the whole tree on
# timeout/cancel. Same pattern as `NativeEnv::exec` (PR #40), the bash tool (PR #41),
# and shell hooks (PR #58).
libc = "0.2"

[dev-dependencies]
tests-bridge-macro = { version = "0.1.5", path = "../tests-bridge-macro" }
tempfile = "3"
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
qrcode = { version = "0.14", default-features = false }

[lints]
workspace = true
