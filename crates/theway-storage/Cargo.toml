[package]
name = "theway-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "theway storage backends — concrete session and DAG persistence implementations (SQLite via Turso) for leaf contracts."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
# DAG runtime snapshots still come from theway-core until the DAG persistence
# contract is moved to the leaf contract crate.
theway-core = { path = "../theway-core" }
turso = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
async-trait = "0.1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
# Session helpers + archive: tar/toml/sha2 for `.theway-session` archives;
# theway-contract owns session persistence, sidecar models, and path layout.
theway-contract = { path = "../theway-contract" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
