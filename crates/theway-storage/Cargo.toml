[package]
name = "theway-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "theway storage backends — concrete session and DAG persistence implementations (SQLite via Turso) for leaf contracts."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
turso = { version = "0.7", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
async-trait = "0.1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
# Session/archive and DAG snapshots implement pure leaf contracts.
theway-contract = { version = "0.1.5", path = "../theway-contract" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tests-bridge-macro = { version = "0.1.5", path = "../tests-bridge-macro" }
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
