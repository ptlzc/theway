[package]
name = "theway-storage"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway storage backends — concrete SessionStorage / DAG-persist implementations (SQLite via Turso) for theway-core contracts."
license = "MIT"
repository = "https://github.com/ptlzc/theway"
authors = ["theway contributors"]

[dependencies]
# Engine contracts + types come from theway-core; this crate only implements
# them. No reverse dependency (core never sees this crate).
theway-core = { path = "../theway-core" }
turso = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs"] }
async-trait = "0.1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
parking_lot = "0.12"
tracing = "0.1"
# Session helpers + archive (daemon-kernel-layers: moved from the SDK): tar/toml/sha2
# for `.theway-session` archives, serde for sidecar models, theway-contract for the
# shared trigger models + base-dir/path contract (issue #64: storage depends on the
# pure leaf contract crate, never on the transport stack).
theway-contract = { path = "../theway-contract" }
theway-llm-provider = { path = "../theway-llm-provider" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tar = "0.4"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
tempfile = "3"
theway-llm-provider = { path = "../theway-llm-provider" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[lints]
workspace = true
