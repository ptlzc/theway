[package]
name = "theway-contract"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway shared contract — pure leaf crate holding cross-crate data models (session-scoped trigger sidecar models) and the base-dir/path layout contract. No engine, no protocol, no runtime; never depends on core/llm/transport/storage."
license = "MIT"
repository = "https://github.com/ptlzc/theway"
authors = ["theway contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# The path contract's `cwd_hash` must stay byte-identical with existing on-disk
# session dir names (`<base>/sessions/<hash>`), so it keeps the sha2/hex
# implementation. Both are small, pure crates already in the dependency graph;
# reusing them avoids hand-rolling a digest in this leaf crate.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
