[package]
name = "theway-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "theway shared leaf contract — raw session persistence interfaces, persisted DAG snapshots, sidecar models, and path layout; no engine, protocol, or runtime dependencies."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
schemars = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# The path contract's `cwd_hash` must stay byte-identical with existing on-disk
# session dir names (`<base>/sessions/<hash>`), so it keeps the sha2/hex
# implementation. Both are small, pure crates already in the dependency graph;
# reusing them avoids hand-rolling a digest in this leaf crate.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
