[package]
name = "theway-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "theway protocol layer — wire model + HTTP/WS/gRPC transports, independent of the server business logic, plus the shared client-contract modules (auth/config/feed/history/images/mentions/commands/triggers)."
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
theway-contract = { version = "0.1.5", path = "../theway-contract" }
theway-llm-provider = { version = "0.1.5", path = "../theway-llm-provider" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "io-std", "net", "process", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
toml = "0.8"
regex = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v7", "serde"] }

axum = { version = "0.8", features = ["ws"] }
prost = "0.14"
tonic = { version = "0.14", features = ["server", "channel", "codegen"] }
tonic-prost = "0.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tests-bridge-macro = { version = "0.1.5", path = "../tests-bridge-macro" }
tempfile = "3"

[lints]
workspace = true
