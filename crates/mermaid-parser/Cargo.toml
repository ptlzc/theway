[package]
name = "mermaid-rs-parser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Vendored parse stage of mermaid-rs-renderer (mmdr) 0.3.1: Mermaid source -> IR Graph. Copied verbatim from the upstream crate (parser.rs/ir.rs/error.rs); only the crate shell is new."
repository = "https://github.com/1jehuang/mermaid-rs-renderer"
keywords = ["mermaid", "parser", "flowchart", "diagram"]
categories = ["parser-implementations", "visualization"]

[dependencies]
anyhow = "1.0"
json5 = "1.3"
once_cell = "1.21"
regex = "1.12"
serde_json = "1.0"
thiserror = "2.0"
