[package]
name = "theway-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "gRPC serviceability probe for theway --grpc: health check, multi-session, graceful shutdown"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
include = [
    "AGENTS.md",
    "README*.md",
    "README.i18n.yaml",
    "build.rs",
    "docs/**",
    "proto/**",
    "src/**",
]

[[bin]]
name = "theway-probe"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal"] }
tonic = { version = "0.14", features = ["channel", "codegen"] }
tonic-prost = "0.14"
prost = "0.14"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[lints]
workspace = true
