[package]
name = "theway-core"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway core — stateful agent runtime + harness (Agent loop, skills, prompt templates, sessions, compaction) on top of theway-llm-provider."
license = "MIT"
repository = "https://github.com/earendil-works/theway"
authors = ["theway contributors"]

[lib]
name = "theway_core"
path = "src/lib.rs"

[features]
default = ["harness", "native-env"]

# Bare Agent + agent-loop. Always on.
# Harness layer (skills, prompt templates, sessions, compaction, system prompt). Opt-out for
# embedders that only want the bare Agent (e.g. browser-side consumers).
harness = []
# Native filesystem adapter (std::fs). Default for native targets; turn off for wasm.
native-env = []

[dependencies]
theway-llm-provider = { path = "../llm-provider" }
# MCP client/adapter for the builtin tools (`runtime/tools/mcp_adapter.rs`). One-way
# dependency: theway-mcp does NOT depend on theway-core (no cycle).
theway-mcp = { path = "../mcp" }

tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"
parking_lot = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"

thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
ignore = "0.4"
regex = "1"
# Vendored mermaid parse stage (mmdr 0.3.1) — see crates/mermaid-parser.
mermaid-rs-parser = { path = "../mermaid-parser" }

# Builtin tools (`tools/`). install_skill needs the HTTP client. Local-execution tools
# (bash/fs/git/grep/find/ls/outline) and web tools live in the server crate (app layer);
# reqwest stays here for install_skill, directories for skills-state paths.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
once_cell = "1"
tracing = "0.1"
directories = "5"
hex = "0.4"
# hooks (user-configured CLI hooks: TOML rules + shell/webhook side effects) and
# goal (session goal stop-hook) live in the engine; toml parses hook rules, anyhow
# is the hook runner's error type (mirrors the former server-crate versions).
toml = "0.8"
anyhow = "1"
# Stable content hash for trigger_promotion audit. Used only to fingerprint promotion
# template bodies for cross-process replay verification — never used as a credential
# / authentication primitive. SHA-256 is overkill cryptographically for this purpose
# but avoids the "two hashers disagree" footgun of non-deterministic stdlib hashers.
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
