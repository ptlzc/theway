[package]
name = "theway"
version = "0.75.0"
edition = "2024"
rust-version = "1.85"
description = "theway client SDK — the client-facing surface of the theway agent runtime: common wire/session/config/feed types and the command framework, a local layer (session repo, auth, history, images, mentions, local commands, LocalExecutor) and a sandbox layer (stub executor). Embeddable library consumed by the TUI and external projects; the daemon runtime lives in theway-daemon."
license = "MIT"
authors = ["theway contributors"]

[lib]
name = "theway"
path = "src/lib.rs"

[dependencies]
theway-core = { path = "../theway-core" }
theway-storage = { path = "../theway-storage" }
theway-transport = { path = "../theway-transport" }
# Same feature posture as theway-daemon: every wire-protocol provider enabled so the
# auth/config/model-catalog layers see the full catalog.
theway-llm-provider = { path = "../theway-llm-provider", default-features = false, features = ["all-providers"] }

# Local-surface modules moved out of the daemon crate (node 3-move-modules of
# sdk-split-local-sandbox): config/session/auth/stream_auth/history/images/mentions
# under `local/`, config + feed under `common/`. Versions mirror theway-daemon.
# fs/session modules + LocalExecutor (node 4-local-executor of sdk-split-local-sandbox):
# `process` for run_command/git, `time` for the run_command timeout kill.
tokio = { version = "1", features = ["macros", "rt", "fs", "process", "time"] }
# LocalExecutor tool surface: `async_trait` to implement theway_core::executor::ToolExecutor,
# `ignore` for .gitignore-aware grep/find walks, `regex` for grep patterns
# (versions mirror theway-daemon).
async-trait = "0.1"
ignore = "0.4"
regex = "1"
# Command framework (node 5-commands-layer of sdk-split-local-sandbox): the console
# output sink guards its global slot with parking_lot (mirrors theway-daemon).
parking_lot = "0.12"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
directories = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# session_archive: `.theway-session` tar export/import (mirrors theway-daemon).
tar = "0.4"
rpassword = "7"
base64 = "0.22"
# common/feed renders width-aware ratatui lines (shared transcript model for the
# TUI and daemon snapshots — see design.md decision on keeping Feed in the SDK).
ratatui = { version = "0.29" }
unicode-width = "0.2"
# Cross-process file lock for the edit tool's read→modify→write cycle (issue #17).
# Already in the dependency tree via tantivy, so this adds no new packages.
fs4 = "0.13"

[dev-dependencies]
tests-bridge-macro = { path = "../tests-bridge-macro" }
tempfile = "3"

[lints]
workspace = true
