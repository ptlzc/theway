[package]
name = "tgrep-cli"
version = "1.0.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/tgrep"
authors = ["Shengyu Fu"]
description = "Trigram-indexed grep — fast regex search for large codebases with client/server architecture"
keywords = ["grep", "search", "regex", "trigram", "cli"]
categories = ["command-line-utilities", "text-processing"]
readme = "../README.md"

[[bin]]
name = "tgrep"
path = "src/main.rs"

# Vendored upstream source is not rewritten for workspace style (see AGENTS.md):
# lint allowances live at this manifest boundary, not in the code.
[lints.clippy]
nonminimal_bool = "allow"

[dependencies]
tgrep-core = { path = "../tgrep-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
notify = "7"
rayon = "1"
regex = "1"
fancy-regex = "0.14"
lru = "0.16.3"
fs2 = "0.4.3"
globset = "0.4.18"
memmap2 = "0.9"
memchr = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Own workspace root: the repository root manifest excludes this crate, so its
# dependency resolution, lockfile, and lint configuration are standalone.
[workspace]
resolver = "2"

# Standalone workspace (root Cargo.toml excludes this crate), so the dist profile must be
# declared here with the same shape as the root [profile.dist] / [profile.release] pair.
[profile.dist]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
