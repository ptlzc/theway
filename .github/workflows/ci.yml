name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # NOTE: do NOT set `RUSTFLAGS: -D warnings` globally — it would make every cargo invocation
  # (including `cargo test`) fail on lint warnings from generated/transitive crates. The
  # `clippy` job below passes `-D warnings` via `clippy -- -D warnings` instead, so deny-warn
  # only applies to first-party clippy lints.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            clippy-${{ runner.os }}-
      # `--workspace` + `--all-targets` covers every crate's lib/bin/tests/examples. All 10
      # providers are linted because `theway` already activates the `all-providers`
      # feature on `theway-llm-provider` (feature unification across the workspace).
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            test-${{ runner.os }}-
      - name: cargo test --workspace
        # Strip all provider env vars so any test that accidentally hits a real API will
        # self-skip / error cleanly. Mirrors the TS repo's `test.sh` discipline.
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          GROQ_API_KEY: ""
          MISTRAL_API_KEY: ""
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
          AWS_BEARER_TOKEN_BEDROCK: ""
          GOOGLE_VERTEX_ACCESS_TOKEN: ""
          CODEX_AUTH_TOKEN: ""
          AZURE_OPENAI_API_KEY: ""
        run: cargo test --workspace

  # ----------------------------------------------------------------
  # L4 性能层编译门禁 — 完整 bench 不进 PR, 这里仅 `--test` (dry-run
  # 编译) 验证 bench 代码可编译。跑完整 bench 用:
  #   cargo bench -p theway-core --bench dispatch
  # ----------------------------------------------------------------
  bench-check:
    name: bench-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: bench-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            bench-${{ runner.os }}-
      - run: cargo bench -p theway-core --bench dispatch -- --test

  # ----------------------------------------------------------------
  # L0 feature 门控 — 验证 bare core/provider 不携带 harness 或具体
  # provider 的实现树，并单独覆盖 harness、Bedrock 和全 provider 组合。
  #
  # daemon 执行后端矩阵 (issue #78): daemon 不再本地执行文件/进程操作,
  # 工具操作转发给 controller 的 ToolService。`local` / `sandbox` 保留为
  # 兼容性 feature 名称,矩阵仍验证 default/sandbox-only/all-features 编译。
  # ----------------------------------------------------------------
  feature-gate-check:
    name: feature-gate-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo registry cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: gate-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            gate-${{ runner.os }}-
      - run: cargo check -p theway-core --no-default-features
      - name: core harness without default providers
        run: cargo check -p theway-core --no-default-features --features harness
      - name: provider registry without concrete providers
        run: cargo check -p theway-llm-provider --no-default-features
      - name: provider Bedrock dependency gate
        run: cargo check -p theway-llm-provider --no-default-features --features amazon-bedrock
      - name: provider all features
        run: cargo check -p theway-llm-provider --all-features
      - name: daemon default features
        run: cargo check -p theway-daemon --all-targets
      - name: daemon sandbox-only
        run: cargo check -p theway-daemon --no-default-features --features sandbox --all-targets
      - name: daemon all features
        run: cargo check -p theway-daemon --all-features --all-targets
      - name: daemon sandbox-only tool-gate tests
        run: cargo test -p theway-daemon --no-default-features --features sandbox --test sandbox_tool_gate
