name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to publish (e.g. v0.1.1)"
        required: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(awk -F '"' '/^\[workspace.package\]/{found=1; next} found && /^version = /{print $2; exit}' Cargo.toml)"
          if [ "$tag" != "v$version" ]; then
            echo "release tag $tag does not match workspace version $version" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }} --workspace
        shell: bash

      - name: package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          name="theway-${RELEASE_TAG}-${{ matrix.target }}"
          extension=""
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            extension=".exe"
          fi
          mkdir -p dist/"$name"
          for binary in theway thewayd theway-probe; do
            source="target/${{ matrix.target }}/release/$binary$extension"
            test -f "$source" || {
              echo "missing release binary: $source" >&2
              exit 1
            }
            cp "$source" dist/"$name"/
          done
          cp dist/"$name"/theway$extension dist/"$name"/tw$extension
          cp README.md LICENSE dist/"$name"/
          {
            echo "tag=$RELEASE_TAG"
            echo "commit=$RELEASE_COMMIT"
            echo "target=${{ matrix.target }}"
          } > dist/"$name"/RELEASE-METADATA
          case "${{ matrix.archive }}" in
            tar.gz)
              tar -C dist -czf dist/"$name".tar.gz "$name"
              ;;
            zip)
              powershell -NoLogo -NoProfile -NonInteractive -Command \
                "Compress-Archive -Path 'dist/$name' -DestinationPath 'dist/$name.zip' -Force"
              ;;
            *)
              echo "unsupported archive format: ${{ matrix.archive }}" >&2
              exit 1
              ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "asset=dist/${name}.${{ matrix.archive }}" >> "$GITHUB_OUTPUT"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: github release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: gather artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find dist -type f \( -name "*.tar.gz" -o -name "*.zip" \) -print0 | sort -z
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "no release archives downloaded" >&2
            exit 1
          fi
          : > dist/SHA256SUMS
          for asset in "${assets[@]}"; do
            checksum="$(sha256sum "$asset" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$checksum" "$(basename "$asset")" >> dist/SHA256SUMS
          done
          cat dist/SHA256SUMS
      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
